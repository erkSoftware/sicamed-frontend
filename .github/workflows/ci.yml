name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint y fronteras de zona
        run: npm run lint

      - name: Pruebas unitarias, de componente y de accesibilidad
        run: npm run test

      - name: Compilación y prerender
        run: npm run build

  extremo-a-extremo:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Flujos críticos y accesibilidad en navegador
        run: npx playwright test --project=escritorio

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14
