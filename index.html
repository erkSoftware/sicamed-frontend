<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/marca/isotipo.svg" />
    <link rel="apple-touch-icon" href="/marca/isotipo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0E5C36" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <script>
      (function () {
        window.__sicamedIntro = window.__sicamedIntro || [];
        function anotar(paso, dato) {
          window.__sicamedIntro.push({ ms: Math.round(performance.now()), paso: paso, dato: dato || {} });
        }
        try {
          var ruta = location.pathname;
          var hash = location.hash;
          var pedida = /^#animation$/i.test(hash);
          var vista = false;
          try {
            vista = localStorage.getItem("SICAMED_intro_animation_seen") === "true";
          } catch (error) {
            vista = "sin acceso";
          }
          var reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
          anotar("guardia", { ruta: ruta, hash: hash, pedida: pedida, vista: vista, reducido: reducido });
          if (ruta !== "/") return;
          if (!pedida && (reducido || vista === true)) return;
          document.documentElement.setAttribute("data-cinematica", "corriendo");
          document.documentElement.setAttribute("data-intro", "corriendo");
          anotar("guardia-activa");
          setTimeout(function () {
            if (document.documentElement.getAttribute("data-cinematica") !== "corriendo") return;
            anotar("guardia-rescate");
            document.documentElement.removeAttribute("data-cinematica");
          }, 40000);
        } catch (error) {
          anotar("guardia-error", { error: String(error) });
          document.documentElement.removeAttribute("data-cinematica");
        }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
